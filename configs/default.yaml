project:
  name: event_timeraf_la
  seed: 42
  timezone: America/Los_Angeles

paths:
  raw: data/raw
  processed: data/processed
  knowledge_base: data/knowledge_base
  outputs: outputs

data:
  start_year: 2019
  end_year: 2025
  # Latest common endpoint supported by the downloaded NOAA ISD inventory.
  # This retains the January 2025 Los Angeles stress episode.
  study_end_date: "2025-08-24"
  epa_state_code: "06"
  epa_county_code: "037"
  epa_parameter_code: 88101
  minimum_pm25_coverage: 0.70
  minimum_weather_coverage: 0.95
  maximum_fill_gap_hours: 3
  minimum_event_days: 30
  minimum_event_overlap_days: 180
  minimum_event_categories: 2
  minimum_event_records_per_category: 20
  noaa_weather_max_distance_km: 80

forecast:
  lookback: 168
  horizon: 24
  split_ratios: [0.70, 0.15, 0.15]

retrieval:
  k: 8
  k_values: [1, 4, 8, 16]
  # Candidate-to-candidate overlap is allowed. Leakage is prevented by the
  # per-query rule candidate_target_end < query_input_start.
  kb_stride_hours: 24
  kb_stride_values: [24, 6, 1]
  event_weight_values: [0.0, 0.2, 0.5, 0.8, 1.0]
  event_context_feature: event_count_72h
  event_stratified_fallback: all_eligible
  normalize_event_scores: true
  block_size: 256
  epsilon: 1.0e-6
  weights:
    time_series: 0.50
    weather: 0.20
    calendar: 0.10
    event: 0.20

drift:
  recent_window_hours: 24
  reference_window_hours: 168
  threshold_quantile: 0.90
  score_mode: two_sided
  ks_reference_size: 4096

model:
  n_estimators: 350
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  n_jobs: -1

evaluation:
  bootstrap_resamples: 5000
  bootstrap_block_hours: 168
  dm_hac_lags: 168
  minimum_subset_origins: 50
  # Operational thresholds applied to each 24-hour forecast mean.
  aqi_thresholds: [35.4, 55.4]
  probabilistic_quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

baseline:
  neural_batch_size: 256
  neural_max_epochs: 30
  neural_patience: 5
  neural_learning_rate: 0.001
  neural_weight_decay: 0.0001
  dlinear_moving_average: 25
  lstm_hidden_size: 64
  lstm_layers: 2
  lstm_dropout: 0.1
  patch_length: 24
  patch_stride: 12
  patch_layers: 3
  patch_d_model: 64
  patch_heads: 4
  patch_ffn_dim: 128

tsfm:
  checkpoint: amazon/chronos-bolt-small
  batch_size: 64
  fusion_weights: [0.0, 0.25, 0.5, 0.75, 1.0]
